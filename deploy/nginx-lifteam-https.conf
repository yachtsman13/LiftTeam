# nginx для LiftTeam по HTTPS — нужен только ради камеры в браузере.
#
# Браузер отдаёт камеру исключительно в защищённом окружении. По http
# программа работает целиком, кроме одного: сканировать коды камерой
# телефона или планшета нельзя. USB-сканер от этого не зависит вовсе.
#
# Сертификат выдаёт сама Tailscale — бесплатно и на настоящее имя
# в зоне ts.net, то есть браузер ему верит без предупреждений
# и «продолжить на свой страх» нажимать не придётся.
#
# Установка описана в DEPLOY.md, раздел «HTTPS и камера». Коротко:
#   sudo tailscale cert --cert-file /etc/ssl/lifteam/lifteam.crt \
#                       --key-file  /etc/ssl/lifteam/lifteam.key \
#                       ИМЯ.tailXXXX.ts.net
#   sudo cp deploy/nginx-lifteam-https.conf /etc/nginx/sites-available/lifteam
#   sudo nginx -t && sudo systemctl reload nginx
#
# Этот файл заменяет nginx-lifteam.conf целиком: он содержит и блок 80,
# и блок 443. Держать оба файла включёнными нельзя — они спорят за одно
# и то же имя.

upstream lifteam_app {
    server 127.0.0.1:8000;
}

# Порт 80 остаётся, но только чтобы увести на 443. Отдавать по http
# то же самое было бы хуже, чем не отдавать: страница открылась бы,
# камера бы не заработала, и причина осталась бы неясной.
server {
    listen 80;
    listen [::]:80;

    # ВПИШИТЕ СВОИ ЗНАЧЕНИЯ — те же, что в блоке 443 ниже и в ALLOWED_HOSTS.
    server_name lifteam.taile9b605.ts.net 192.168.1.50 localhost;

    # Тот же список своих, что и на 443: заголовок Host подставляет кто
    # угодно, и не пускает в интернет именно это, а не server_name.
    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;
    allow 192.168.1.0/24;
    deny all;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # ВПИШИТЕ СВОИ ЗНАЧЕНИЯ. Имя в Tailscale обязано совпадать с тем,
    # на которое выписан сертификат, иначе браузер откажет.
    server_name lifteam.taile9b605.ts.net 192.168.1.50 localhost;

    # Сертификат от Tailscale. Обновляется командой `tailscale cert`
    # (см. lifteam-cert.timer): он живёт около трёх месяцев, и просроченный
    # закрывает программу целиком, а не только камеру.
    ssl_certificate     /etc/ssl/lifteam/lifteam.crt;
    ssl_certificate_key /etc/ssl/lifteam/lifteam.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    # То же ограничение по адресу отправителя, что и на 80. HTTPS шифрует
    # канал, но никого не отсекает: без этих строк программа была бы
    # открыта миру, просто по защищённому соединению.
    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;
    allow 192.168.1.0/24;
    deny all;

    client_max_body_size 25M;

    location /static/ {
        alias /opt/lifteam/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/lifteam/media/;
        expires 7d;
        access_log off;
    }

    location /ws/ {
        proxy_pass http://lifteam_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://lifteam_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Ради этого заголовка всё и затевалось со стороны приложения:
        # по нему Django понимает, что снаружи HTTPS, и перестаёт
        # уводить обратно на http
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

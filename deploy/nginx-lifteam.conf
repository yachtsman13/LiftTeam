# nginx для LiftTeam на Raspberry Pi.
#
# Установка:
#   sudo cp deploy/nginx-lifteam.conf /etc/nginx/sites-available/lifteam
#   sudo ln -s /etc/nginx/sites-available/lifteam /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream lifteam_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;

    # Впишите сюда адреса, по которым открывают приложение: локальный IP Pi
    # в офисной сети и имя устройства в Tailscale. Эти же значения должны
    # быть в ALLOWED_HOSTS в файле .env, иначе Django ответит 400.
    server_name _;

    # Этикетки печатаются картинками в base64, а импорт принимает файлы Excel
    client_max_body_size 25M;

    # Статику отдаёт nginx напрямую — до приложения такие запросы не доходят
    location /static/ {
        alias /opt/lifteam/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/lifteam/media/;
        expires 7d;
        access_log off;
    }

    # WebSocket для уведомлений об изменении остатков (core/consumers.py).
    # Без заголовков Upgrade/Connection соединение не установится, и остатки
    # перестанут обновляться без перезагрузки страницы.
    location /ws/ {
        proxy_pass http://lifteam_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket живёт долго и молчит между событиями — короткий таймаут
        # рвал бы соединение каждую минуту
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://lifteam_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

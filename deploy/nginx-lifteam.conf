# nginx для LiftTeam на Raspberry Pi.
#
# Установка:
#   sudo cp deploy/nginx-lifteam.conf /etc/nginx/sites-available/lifteam
#   sudo ln -s /etc/nginx/sites-available/lifteam /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream lifteam_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;

    # ВПИШИТЕ СВОИ ЗНАЧЕНИЯ. Здесь перечисляются адреса, по которым
    # приложение открывают свои: имя Pi в Tailscale, локальный адрес Pi
    # в офисной сети, localhost. Эти же значения должны быть
    # в ALLOWED_HOSTS в файле .env, иначе Django ответит 400.
    #
    # Раньше здесь стояло `server_name _;`, и работало это только потому,
    # что блок был единственным и принимал всё подряд. С появлением блока
    # для уведомлений банков (nginx-lifteam-hooks.conf), который объявлен
    # default_server, `_` перестал совпадать хоть с чем-нибудь: запросы
    # уходили в тот блок и получали 404, то есть приложение переставало
    # открываться.
    server_name lifteam.taile9b605.ts.net 192.168.1.50 localhost;

    # ВПИШИТЕ СВОЮ ПОДСЕТЬ. Это и есть то, что не пускает приложение
    # в интернет, — а вовсе не строка server_name выше.
    #
    # Заголовок Host подставляет кто угодно: запрос из интернета
    # с подставленным «Host: lifteam.taile9b605.ts.net» попал бы именно
    # в этот блок, потому что nginx выбирает блок по одному только Host.
    # Адрес отправителя подставить нельзя — по нему и отсекаем:
    #   100.64.0.0/10 — сеть Tailscale (все свои устройства);
    #   192.168.1.0/24 — офисная сеть, поставьте свою;
    #   127.0.0.1 и ::1 — сама Pi (проверки, healthcheck).
    allow 127.0.0.1;
    allow ::1;
    allow 100.64.0.0/10;
    allow 192.168.1.0/24;
    deny all;

    # Этикетки печатаются картинками в base64, а импорт принимает файлы Excel
    client_max_body_size 25M;

    # Статику отдаёт nginx напрямую — до приложения такие запросы не доходят
    location /static/ {
        alias /opt/lifteam/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/lifteam/media/;
        expires 7d;
        access_log off;
    }

    # WebSocket для уведомлений об изменении остатков (core/consumers.py).
    # Без заголовков Upgrade/Connection соединение не установится, и остатки
    # перестанут обновляться без перезагрузки страницы.
    location /ws/ {
        proxy_pass http://lifteam_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket живёт долго и молчит между событиями — короткий таймаут
        # рвал бы соединение каждую минуту
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://lifteam_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

# nginx для приёма уведомлений банков — единственное, что открыто в интернет.
#
# Отдельный файл от nginx-lifteam.conf намеренно: тот блок обслуживает
# приложение целиком и должен оставаться доступным только из офисной сети
# и Tailscale. Этот — смотрит наружу, и наружу из него отдаётся ровно
# один каталог адресов, /webhooks/. Всё остальное получает 404.
#
# Установка (порядок и объяснения — в DEPLOY.md, раздел «Приём уведомлений
# от банков из интернета»):
#   sudo cp deploy/nginx-lifteam-hooks.conf /etc/nginx/sites-available/lifteam-hooks
#   sudo nano /etc/nginx/sites-available/lifteam-hooks   # вписать своё имя
#   sudo ln -s /etc/nginx/sites-available/lifteam-hooks /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hooks.example.ru
#
# Сертификата в этом файле нет: его дописывает certbot при выпуске.
# Прописать его заранее нельзя — nginx не запустится, пока файлов
# сертификата не существует.

server {
    # default_server — чтобы запросы на голый белый IP и на любое чужое имя
    # попадали сюда и получали 404, а не в приложение. Заголовок Host
    # подделывается кем угодно, и без этого запрос с подставленным
    # «Host: 192.168.1.50» открыл бы всё приложение из интернета.
    listen 80 default_server;
    listen [::]:80 default_server;

    # Впишите сюда своё имя: поддомен вашего домена (например
    # hooks.lifteam.ru) или имя, полученное на DuckDNS. Это же имя должно
    # быть в ALLOWED_HOSTS в файле .env, иначе Django ответит банку 400.
    server_name hooks.example.ru;

    # Уведомление банка — несколько килобайт. Всё, что больше, отсекается
    # здесь и до приложения не доходит: память на Raspberry Pi считанная.
    # Приложение проверяет размер ещё раз само (WEBHOOKS_MAX_BODY_BYTES).
    client_max_body_size 1m;

    # Единственное, что проходит внутрь
    location /webhooks/ {
        # Адреса, с которых Т-Банк присылает уведомления, — те шесть, что
        # перечислены в его документации (раздел «Вебхуки»). Здесь они
        # отсекают чужой запрос до приложения; приложение проверяет тот же
        # список ещё раз само (настройка WEBHOOKS_TBANK_IPS), и списки
        # обязаны совпадать — за этим следит тест.
        #
        # Сеть 91.194.226.0/23 из той же страницы сюда НЕ вписана: она
        # относится к товарному кредитованию покупателей, которым мы
        # не пользуемся, а это 510 адресов вместо шести.
        #
        # Адресов Точки не знает никто: её документация об уведомлениях
        # недоступна. Поэтому /webhooks/tochka/ закрыт и здесь — так же,
        # как закрыт в самом приложении. Когда адреса станут известны,
        # их дописывают сюда же.
        allow 212.233.80.7;
        allow 91.218.132.2;
        allow 91.194.226.234;
        allow 91.194.226.235;
        allow 91.194.226.250;
        allow 91.194.226.251;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Банк ждёт ответа недолго и повторяет доставку при таймауте —
        # держать соединение минутами незачем
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Всё остальное — как будто ничего и нет. Ни страницы входа,
    # ни статики, ни /admin/: в приложении реальные данные заказчиков,
    # и на разговор с интернетом оно не рассчитано.
    location / {
        return 404;
    }
}

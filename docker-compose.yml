version: "3.9"

services:
  db:
    image: postgres:16
    container_name: lifteam_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifteam}
      POSTGRES_USER: ${POSTGRES_USER:-lifteam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifteam -d lifteam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lifteam_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: lifteam_web
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: lifteam.settings_production
      DATABASE_URL: postgres://${POSTGRES_USER:-lifteam}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-lifteam}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py init_cells &&
             python manage.py create_admin --username admin --name Administrator --password admin123 --force || true &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 lifteam.asgi:application"

  nginx:
    image: nginx:alpine
    container_name: lifteam_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  redis_data:
  media_files:
  staticfiles:





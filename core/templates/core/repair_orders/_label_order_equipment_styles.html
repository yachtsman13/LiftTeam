{% comment %}
Оформление этикетки оборудования в заказе — общее для печати по одной
и пачкой. Размеры должны совпадать до миллиметра: иначе одна и та же
единица оборудования печаталась бы по-разному в зависимости от того,
откуда её напечатали.
{% endcomment %}
<style>
    .label-sheet {
        width: 43mm;
        height: 25mm;
        padding: 0.7mm 1.5mm;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: #000;
    }
    .label-order-number {
        text-align: center;
        font-size: 8pt;
        font-weight: bold;
        line-height: 1;
        border-bottom: 0.25mm solid #000;
        padding-bottom: 0.15mm;
        flex-shrink: 0;
        white-space: nowrap;
    }
    /* Номер позиции вынесен в ту же строку, что и номер заказа: по одной
       строке сразу видно и заказ, и какая это единица оборудования. */
    .label-position {
        font-size: 9pt;
    }
    .label-body {
        display: flex;
        align-items: stretch;
        gap: 1mm;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        padding-top: 0.4mm;
    }
    /* Ширины заданы явно: при flex: 1 колонка не сжималась под содержимое
       и выталкивала код за край этикетки. 26,2 + 1,5 + 12,3 = 40 мм — ровно
       полезная ширина, те же доли, что и на складской этикетке. */
    .label-info {
        flex: 0 0 26.2mm;
        width: 26.2mm;
        min-width: 0;
        min-height: 0;
        max-height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        /* Не по центру: если содержимое всё же не поместилось, при
           центрировании обрезаются оба края сразу — пропадает верх
           названия модели. Прижатое к верху теряет только низ, то есть
           дату приёмки: из трёх строк она наименее важная. */
        justify-content: flex-start;
        gap: 0.4mm;
        --fit: 1;
    }
    /* Строки переносятся, а не тянутся в одну. Раньше здесь стоял nowrap,
       и длинное название модели молча обрезалось на середине: браузер не
       сообщает о переполнении строки по ширине (scrollWidth такой строки
       равен clientWidth), поэтому подгонка шрифта считала, что всё
       поместилось, и не уменьшала его. С переносом переполнение становится
       вертикальным, а его блок выше показывает честно — и подгонка
       срабатывает. overflow-wrap: anywhere нужен для неразрывных кусков:
       артикул и серийный номер пробелов не содержат.

       Своего overflow у строк по-прежнему нет намеренно: он спрятал бы
       переполнение внутри строки, а блок выше отчитался бы, что всё
       поместилось. Обрезать здесь нечего: серийный номер в двадцать два
       знака и есть то, ради чего этикетку читают. */
    .label-model {
        font-size: calc(8pt * var(--fit));
        font-weight: bold;
        line-height: 1.05;
        overflow-wrap: anywhere;
    }
    /* Серийный номер набран как модель, а не мельче: если код повреждён —
       а на оборудовании это обычное дело, — прибор находят в программе
       поиском по этому номеру, и прочитать его надо глазами. До v2.96.0
       он стоял на пункт мельче и обычным начертанием, то есть выглядел
       пояснением к модели, хотя опознаёт прибор именно он. */
    .label-serial {
        font-size: calc(8pt * var(--fit));
        font-weight: bold;
        line-height: 1.05;
        overflow-wrap: anywhere;
    }
    .label-date { font-size: calc(5.5pt * var(--fit)); white-space: nowrap; }
    /* Тот же размер, что и на складской этикетке: 12,3 мм. Без кольца вокруг
       кода он уже ничем не ограничен, но крупнее делать незачем — размер
       у всех этикеток должен быть один, иначе сканер приходится подносить
       по-разному. */
    .label-qr-wrap {
        flex: 0 0 12.3mm;
        width: 12.3mm;
        height: 12.3mm;
        align-self: center;
    }
    .label-qr {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
    }
    /* Название и сайт — вместо прежней эмблемы. Отдельной строкой, а не
       вместе с телефонами: вчетвером в 40 мм они не помещаются даже
       при 4,5 пунктах. */
    /* Строка освободилась там, где было отдельное обозначение
       исполнения, и ушла сюда: на печати 4,5 пункта читались с трудом.
       Комментарии в стилях уезжают в страницу, поэтому прежней приписки
       здесь нет даже в пояснении — её отсутствие проверяется тестом. */
    .label-company {
        text-align: center;
        font-size: 6pt;
        font-weight: bold;
        line-height: 1;
        flex-shrink: 0;
        padding-top: 0.4mm;
    }
    /* Жирный и крупнее, чем было (4,5 пункта обычным начертанием): на
       термопринтере тонкие штрихи такого размера пропечатываются через
       раз, и телефоны на готовой наклейке было почти не разобрать. */
    /* На печати 5 пунктов почти не читались — по ним звонят, а не
       разглядывают. Крупнее в одну строку не выходит: два номера
       с разделителем при 6,5 пункта в 40 мм не помещаются, поэтому
       строки две, а каждый номер внутри неразрывен. */
    .label-phones {
        text-align: center;
        font-size: 6.5pt;
        font-weight: bold;
        line-height: 1.05;
        flex-shrink: 0;
        padding-top: 0.3mm;
    }
    .label-phones span { white-space: nowrap; }
</style>

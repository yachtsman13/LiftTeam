{% extends 'core/base.html' %}

{% block title %}Этикетка {{ cell.address }} — LiftTeam v2.22.0{% endblock %}

{% block content %}
<div class="label-container">
    {% include 'core/storage_cells/_label.html' %}

    <div class="label-controls no-print">
        <button onclick="window.print()" class="btn btn-primary"><i class="bi bi-printer me-2"></i>Печать</button>
        <a href="{% url 'storage_cell_grid' %}?cabinet={{ cell.cabinet_number }}" class="btn btn-outline-secondary">Назад</a>
    </div>
</div>

{% include 'core/storage_cells/_label_styles.html' %}
<style>
    @media screen {
        .label-container { display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .label-sheet { border: 1px dashed #999; background: #fff; }
        .label-controls { margin-top: 20px; }
    }
    @media print {
        @page { size: 43mm 25mm; margin: 0; }
        body { margin: 0; padding: 0; background: white; }
        .sidebar, .sidebar-toggle, .main-content > *:not(.label-container), .no-print, nav, .btn { display: none !important; }
        .main-content { margin-left: 0 !important; padding: 0 !important; }
        .label-container { display: block; padding: 0; }
        .label-sheet { border: none; page-break-inside: avoid; }
    }
</style>
{% endblock %}
